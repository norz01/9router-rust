[package]
name = "constants-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Rust port of `internal/constants/`: application-wide constants and the default HTTP transport config"

[lib]
path = "src/lib.rs"

[dependencies]

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
